# Kuber: TCP connections must be TLS and authenticate with SCRAM; plain TCP is refused.
# Unix-socket access exists only inside the container (initialisation, health checks).
local    all  all                  trust
hostssl  all  all  0.0.0.0/0       scram-sha-256
hostssl  all  all  ::/0            scram-sha-256
host     all  all  0.0.0.0/0       reject
host     all  all  ::/0            reject
