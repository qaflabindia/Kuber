# Local cell: one of each stateful component plus core and web.
# Production runs these per cell on EKS (implementation design, section 16.6).
#
# Hardened by default:
#   - secrets and keys live in ~/.kuber (scripts/secure-setup.sh), never in this repository;
#     start with ./kuber, which passes them in. Plain `docker compose up` fails with instructions.
#   - every internal link is TLS with certificate verification (local CA in ~/.kuber/certs);
#     PostgreSQL refuses non-TLS TCP; the core refuses to start without TLS (KUBER_REQUIRE_TLS).
#   - data is encrypted by the core before it reaches PostgreSQL or NATS (~/.kuber/master.keys).
#   - every published port is bound to 127.0.0.1.
name: kuber

x-secrets: &need
  KUBER_HOME: ${KUBER_HOME:?run ./scripts/secure-setup.sh, then start with ./kuber}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kuber
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run ./scripts/secure-setup.sh, then start with ./kuber}
      POSTGRES_DB: kuber
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?missing}
    # The server key must be owned by postgres with mode 0600: copy it in from the read-only mount.
    entrypoint: ["sh", "-c", "install -o postgres -g postgres -m 600 /certs/server.key /var/lib/postgresql/server.key && install -o postgres -g postgres -m 644 /certs/server.crt /var/lib/postgresql/server.crt && exec docker-entrypoint.sh \"$@\"", "--"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/kuber/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
      - ./deploy/pg_hba.conf:/etc/kuber/pg_hba.conf:ro
      - ${KUBER_HOME:?missing}/certs:/certs:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kuber -d kuber"], interval: 5s, retries: 20 }

  nats:
    image: nats:2.11
    command: ["-js", "-sd", "/data", "--tls", "--tlscert", "/certs/server.crt", "--tlskey", "/certs/server.key", "--auth", "${NATS_TOKEN:?missing}"]
    ports: ["127.0.0.1:4222:4222"]
    volumes: [natsdata:/data, "${KUBER_HOME:?missing}/certs:/certs:ro"]

  valkey:
    image: valkey/valkey:8
    # Copy the key in owned by valkey (the server drops to that user), then start as usual.
    entrypoint: ["sh", "-c", "install -o valkey -g valkey -m 600 /certs/server.key /tmp/server.key && exec docker-entrypoint.sh \"$@\"", "--"]
    command: ["valkey-server", "--port", "0", "--tls-port", "6379", "--tls-cert-file", "/certs/server.crt", "--tls-key-file", "/tmp/server.key",
              "--tls-ca-cert-file", "/certs/ca.crt", "--tls-auth-clients", "no", "--requirepass", "${VALKEY_PASSWORD:?missing}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["${KUBER_HOME:?missing}/certs:/certs:ro"]

  # One-shot migrate step (F14): the only service that runs with the owner credentials at start.
  # Applies migrations and grants, creates the system role, seals legacy identity columns, exits.
  migrate:
    build: .
    command: ["npx", "tsx", "apps/core/src/migrate-cli.ts"]
    environment:
      <<: *need
      MIGRATION_URL: postgres://kuber:${PG_PASSWORD:?missing}@postgres:5432/kuber?sslmode=verify-full
      APP_ROLE: kuber_app
      SYSTEM_ROLE: kuber_system
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD:?run ./scripts/secure-setup.sh to add it}
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      KUBER_REQUIRE_TLS: "true"
      KUBER_MASTER_KEY_FILE: /run/kuber/master.keys
      NODE_ENV: production
    volumes:
      - ${KUBER_HOME:?missing}/master.keys:/kuber/master.keys:ro
      - ${KUBER_HOME:?missing}/certs:/certs:ro
    tmpfs: ["/run/kuber:size=1m,mode=0700"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  core:
    build: .
    # No owner credentials here (F14): the core connects as kuber_app and kuber_system, checks that
    # the migrate step applied every migration, and refuses to start otherwise.
    environment: &core-env
      <<: *need
      DATABASE_URL: postgres://kuber_app:${APP_DB_PASSWORD:?missing}@postgres:5432/kuber?sslmode=verify-full
      # System connection (outbox relay, catch-up reads): the only role that sees every tenant.
      # The migrate service creates it and sets its password.
      SYSTEM_DATABASE_URL: postgres://kuber_system:${SYSTEM_DB_PASSWORD:?run ./scripts/secure-setup.sh to add it}@postgres:5432/kuber?sslmode=verify-full
      NATS_URL: tls://nats:4222
      NATS_TLS_CA: /certs/ca.crt
      NATS_TOKEN: ${NATS_TOKEN:?missing}
      # Replay protection shared by every core instance: accepted request nonces live in Valkey (TLS,
      # verified against the local CA via NODE_EXTRA_CA_CERTS). Unset = in-process, one instance only.
      VALKEY_URL: rediss://valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?missing}
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /run/kuber/server.key          # copied in by deploy/core-entrypoint.sh
      KUBER_REQUIRE_TLS: "true"
      KUBER_MASTER_KEY_FILE: /run/kuber/master.keys
      CELL_ID: local-1
      PORT: "8080"
      # Copilot model (optional). Without both, the canvas uses Kuber's deterministic router.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KUBER_LLM_MODEL: ${KUBER_LLM_MODEL:-}
      KUBER_LLM_CLASSIFY: ${KUBER_LLM_CLASSIFY:-off}
      KUBER_LLM_CLASSIFY_MODEL: ${KUBER_LLM_CLASSIFY_MODEL:-}
      # Agent middleware (services/agent-mw): the copilot's model steps go here, signed with AGENT_MW_SECRET
      # over TLS verified against the local CA. The core holds no model key on this path (agent design 7.1).
      AGENT_MW_URL: https://agent-mw:8443
      AGENT_MW_SECRET: ${AGENT_MW_SECRET:?run ./scripts/secure-setup.sh to add it}
      AGENT_MW_CA_FILE: /certs/ca.crt
      # MCP server for external agents (optional): {"<token>": {"tenant": "...", "book": "main", "principal": "agent:<name>"}}
      KUBER_MCP_TOKENS: ${KUBER_MCP_TOKENS:-}
      # External MCP servers the copilot may read from (optional): [{"name": "...", "url": "...", "allow": [...]}]
      KUBER_MCP_SERVERS: ${KUBER_MCP_SERVERS:-}
      # The web tier signs every request with this secret; the core refuses unsigned requests (F01).
      CORE_AUTH_SECRET: ${CORE_AUTH_SECRET:?run ./scripts/secure-setup.sh to add it}
      # Passkeys: the relying party is the web origin the browser sees.
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      # Development sign-in without a passkey: off unless set to "true" (and refused in production).
      KUBER_DEV_SIGNIN: ${KUBER_DEV_SIGNIN:-false}
      NODE_ENV: production
    volumes:
      - ${KUBER_HOME:?missing}/master.keys:/kuber/master.keys:ro
      - ${KUBER_HOME:?missing}/certs:/certs:ro
    tmpfs: ["/run/kuber:size=1m,mode=0700"]    # keys live in memory only
    ports: ["127.0.0.1:8080:8080"]      # HTTPS; the browser talks only to web
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }
      valkey: { condition: service_started }
    networks: [default, agent]
    restart: unless-stopped

  # Agent middleware: DSPy reasoning programs and the only holder of model keys (agent design 7.1).
  # Reasoning only: no database, broker, cache or tool credentials are given to it. Reachable only from
  # the core on the internal `agent` network; no published port. Outbound only to the model provider
  # (llm-egress). Every call must carry a KH1 assertion signed with AGENT_MW_SECRET, and no model is
  # called until KUBER_LLM_PROCESSING_APPROVED records a processing decision (TAGOF Domain 12).
  agent-mw:
    build: { context: ., dockerfile: services/agent-mw/Dockerfile }
    environment:
      <<: *need
      AGENT_MW_SECRET: ${AGENT_MW_SECRET:?run ./scripts/secure-setup.sh to add it}
      AGENT_MW_TLS_CERT: /certs/agent-mw.crt
      AGENT_MW_TLS_KEY: /run/agent-mw/tls.key       # copied in by deploy/agent-mw-entrypoint.sh
      # Provider-agnostic DSPy model string (anthropic/..., openai/..., ollama_chat/...). Unset = 503 model_not_configured.
      AGENT_MW_MODEL: ${AGENT_MW_MODEL:-}
      KUBER_LLM_PROCESSING_APPROVED: ${KUBER_LLM_PROCESSING_APPROVED:-}
      AGENT_MW_REQUIRE_ARTIFACTS: ${AGENT_MW_REQUIRE_ARTIFACTS:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MW_TIMEOUT_S: "20"
      AGENT_MW_MAX_TOKENS: "1024"
      AGENT_MW_RATE_PER_MINUTE: "60"
    volumes:
      - ${KUBER_HOME:?missing}/certs/ca.crt:/certs/ca.crt:ro
      - ${KUBER_HOME:?missing}/certs/agent-mw.crt:/certs/agent-mw.crt:ro
      - ${KUBER_HOME:?missing}/certs/agent-mw.key:/certs/agent-mw.key:ro
    read_only: true
    tmpfs: ["/run/agent-mw:size=1m,mode=0700", "/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]   # entrypoint only: copy the key, then setpriv drops all
    security_opt: ["no-new-privileges:true"]
    networks: [agent, llm-egress]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      CORE_URL: https://core:8080
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      ORIGIN: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:?missing}
      CORE_AUTH_SECRET: ${CORE_AUTH_SECRET:?run ./scripts/secure-setup.sh to add it}
      KUBER_DEV_SIGNIN: "false"
    volumes: ["${KUBER_HOME:?missing}/certs/ca.crt:/certs/ca.crt:ro"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      core: { condition: service_started }
    restart: unless-stopped

  # Operator commands: ./kuber run --rm tools <command>   (see apps/core/src/keys-cli.ts)
  tools:
    build: .
    profiles: ["tools"]
    entrypoint: ["npx", "tsx", "apps/core/src/keys-cli.ts"]
    user: "0:0"                                     # operator tool: reads and rewrites the mounted key file
    environment:
      <<: *core-env
      # Operator tool: runs with the owner connection (not given to the core).
      MIGRATION_URL: postgres://kuber:${PG_PASSWORD:?missing}@postgres:5432/kuber?sslmode=verify-full
      APP_ROLE: kuber_app
      KUBER_MASTER_KEY_FILE: /kuber/master.keys
    volumes:
      - ${KUBER_HOME:?missing}:/kuber              # read-write: rotate-master rewrites master.keys
      - ${KUBER_HOME:?missing}/certs:/certs:ro
    depends_on:
      postgres: { condition: service_healthy }

networks:
  default: {}
  # core <-> agent-mw only; internal: no route out of it.
  agent: { internal: true }
  # agent-mw's outbound path to the model provider; nothing else joins it.
  llm-egress: {}

volumes:
  pgdata: {}
  natsdata: {}
