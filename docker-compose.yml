# Local cell: one of each stateful component plus the core API.
# Production runs these per cell on EKS (implementation design, section 16.6).
name: kuber
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kuber
      POSTGRES_PASSWORD: kuber
      POSTGRES_DB: kuber
    ports: ["127.0.0.1:5432:5432"]   # loopback only: never expose the database beyond this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kuber -d kuber"], interval: 5s, retries: 20 }
  nats:
    image: nats:2.11
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [natsdata:/data]
  valkey:
    image: valkey/valkey:8
    ports: ["127.0.0.1:6379:6379"]
  core:
    build: .
    environment:
      DATABASE_URL: postgres://kuber_app:kuber_app@postgres:5432/kuber
      MIGRATION_URL: postgres://kuber:kuber@postgres:5432/kuber
      APP_ROLE: kuber_app
      NATS_URL: nats://nats:4222
      CELL_ID: local-1
      PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      CORE_URL: http://core:8080
      ORIGIN: http://localhost:3000
      # Signs the session cookie. Override in .env for anything beyond local use.
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-only-change-me-0123456789abcdef}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      core: { condition: service_started }
    restart: unless-stopped
volumes:
  pgdata: {}
  natsdata: {}
